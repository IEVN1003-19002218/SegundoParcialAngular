<div class="max-w-lg mx-auto mt-8 p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">

  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">
    Eliminar maestro
  </h1>

  <p class="text-gray-600 dark:text-gray-300 mb-4">
    ¿Estás seguro de que deseas eliminar al maestro con ID
    <strong>{{ idmaestro }}</strong>?
  </p>

  <p class="text-red-500 text-sm mb-5">
    Esta acción eliminará el registro de MySQL.
  </p>

  <p *ngIf="mensaje" class="mb-4 text-red-500">
    {{ mensaje }}
  </p>

  <div class="flex gap-3">
    <button type="button" (click)="eliminarMaestro()"
            class="text-white bg-red-600 hover:bg-red-700 rounded-lg px-5 py-2.5">
      Sí, eliminar
    </button>

    <button type="button" (click)="cancelar()"
            class="text-white bg-gray-600 hover:bg-gray-700 rounded-lg px-5 py-2.5">
      Cancelar
    </button>
  </div>
</div>
