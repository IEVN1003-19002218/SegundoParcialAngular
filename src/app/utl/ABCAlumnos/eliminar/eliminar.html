
<div class="max-w-lg mx-auto mt-8 p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">

  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">
    Eliminar alumno
  </h1>

  <p class="text-gray-600 dark:text-gray-300 mb-4">
    ¿Estás seguro de que deseas eliminar al alumno con matrícula
    <strong>{{ matricula }}</strong>?
  </p>

  <p class="text-sm text-red-500 mb-5">
    Se eliminara el registro de la base de datos.
  </p>

  <p *ngIf="mensaje" class="mb-4 text-red-500">
    {{ mensaje }}
  </p>

  <div class="flex gap-3">

    <button
      type="button"
      (click)="eliminarAlumno()"
      class="text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-5 py-2.5">
      Sí, eliminar
    </button>

    <button
      type="button"
      (click)="cancelar()"
      class="text-white bg-gray-600 hover:bg-gray-700 font-medium rounded-lg text-sm px-5 py-2.5">
      Cancelar
    </button>

  </div>
</div>
