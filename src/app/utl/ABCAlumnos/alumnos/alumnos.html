
<div class="p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
      Alumnos UTL
    </h1>

    <a
      routerLink="/utl/alumnos/agregar"
      class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5">
      Agregar
    </a>
  </div>

  <div class="mb-5">
    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
      Filtrar por nombre
    </label>

    <input
      [(ngModel)]="listFilter"
      type="text"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full md:w-1/2 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
      placeholder="Ingrese nombre del alumno"
    >
  </div>

  <h3 class="mb-5 text-lg font-semibold text-gray-700 dark:text-gray-300">
    Filtro: {{ listFilter }}
  </h3>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table
      *ngIf="dataSource.length > 0"
      class="w-full text-sm text-left text-gray-500 dark:text-gray-400"
    >
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
        <tr>
          <th class="px-6 py-3">Matrícula</th>
          <th class="px-6 py-3">Nombre</th>
          <th class="px-6 py-3">Apellido paterno</th>
          <th class="px-6 py-3">Apellido materno</th>
          <th class="px-6 py-3">Correo</th>
          <th class="px-6 py-3">Editar</th>
          <th class="px-6 py-3">Eliminar</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let alumno of dataSource | alumnosUTL:listFilter"
          class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600"
        >
          <td class="px-6 py-4">{{ alumno.matricula }}</td>
          <td class="px-6 py-4 font-semibold text-gray-900 dark:text-white">
            {{ alumno.nombre }}
          </td>
          <td class="px-6 py-4">{{ alumno.apaterno }}</td>
          <td class="px-6 py-4">{{ alumno.amaterno }}</td>
          <td class="px-6 py-4">{{ alumno.correo }}</td>

          <td class="px-6 py-4">
            <a
              [routerLink]="['/utl/alumnos/editar', alumno.matricula]"
              class="text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-4 py-2">
              Editar
            </a>
          </td>

          <td class="px-6 py-4">
            <a
              [routerLink]="['/utl/alumnos/eliminar', alumno.matricula]"
              class="text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-4 py-2">
              Eliminar
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <p
      *ngIf="dataSource.length === 0"
      class="p-4 text-gray-500 dark:text-gray-400"
    >
      No hay alumnos para mostrar.
    </p>
  </div>
</div>
