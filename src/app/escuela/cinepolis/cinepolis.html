<div class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-lg shadow-lg">
  <!-- ENCABEZADO -->
  <div class="bg-blue-900 p-5 rounded-lg mb-6">
    <h1 class="text-3xl font-bold text-center text-white">Cinépolis</h1>
    <p class="text-center text-blue-100">La capital del cine</p>
  </div>

  <form [formGroup]="formulario">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- ENTRADAS -->
      <div class="p-5 border border-gray-300 rounded-lg">
        <h2 class="text-2xl font-bold text-blue-700 mb-5">Entradas</h2>

        <!-- Nombre -->
        <div class="mb-5">
          <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900"> Nombre </label>

          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            placeholder="Nombre del comprador"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          />
        </div>

        <!-- Compradores -->
        <div class="mb-5">
          <label for="compradores" class="block mb-2 text-sm font-medium text-gray-900">
            Cantidad de compradores
          </label>

          <input
            type="number"
            id="compradores"
            formControlName="compradores"
            min="1"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          />
        </div>

        <!-- Tarjeta CINECO -->
        <div class="mb-5">
          <label class="block mb-2 text-sm font-medium text-gray-900"> Tarjeta CINECO </label>

          <div class="flex gap-5">
            <label class="flex items-center gap-2">
              <input
                type="radio"
                formControlName="tarjeta"
                value="si"
                class="w-4 h-4 text-blue-600"
              />
              Sí
            </label>

            <label class="flex items-center gap-2">
              <input
                type="radio"
                formControlName="tarjeta"
                value="no"
                class="w-4 h-4 text-blue-600"
              />
              No
            </label>
          </div>
        </div>

        <!-- Boletos -->
        <div class="mb-5">
          <label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">
            Cantidad de boletos
          </label>

          <input
            type="number"
            id="boletos"
            formControlName="boletos"
            min="1"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          />
        </div>
      </div>

      <!-- SALIDAS -->
      <div class="p-5 border border-gray-300 rounded-lg">
        <h2 class="text-2xl font-bold text-blue-700 mb-5">Salidas</h2>

        <label class="block mb-2 text-sm font-medium text-gray-900"> Valor a pagar </label>

        <input
          type="text"
          [value]="ValorPagar | currency: 'MXN'"
          readonly
          class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5"
        />
      </div>
    </div>

    <!-- MENSAJE -->
    @if (mensaje != '') {
      <p class="mt-5 text-center text-red-600 font-medium">
        {{ mensaje }}
      </p>
    }

    <!-- ACCIONES -->
    <div class="mt-6 p-5 border border-gray-300 rounded-lg">
      <h2 class="text-2xl font-bold text-blue-700 text-center mb-4">Acciones</h2>

      <div class="flex justify-center gap-4">
        <!-- Procesar -->
        <button
          type="button"
          (click)="ProcesarCompra()"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Realizar Compra
        </button>

        <!-- Salir -->
        <button
          type="button"
          (click)="salir()"
          class="text-white bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Salir
        </button>

        <button
          type="button"
          [routerLink]="['/escuela/ventas']"
          class="text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Ver ventas
        </button>
      </div>
    </div>
  </form>
</div>
